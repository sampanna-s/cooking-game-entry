<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle Rush — a tiny kitchen-chaos cooking game</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <p class="help">
      Move with <b>WASD</b> or <b>arrows</b> · <b>E</b> or click: pick up, chop, grill, plate &amp; serve ·
      <b>Q</b> trash · <b>P</b> pause · <b>M</b> mute
    </p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
